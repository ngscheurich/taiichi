image = "taiichi:latest"
cpus = 2
memory = "2G"
shell = "/bin/bash"

[build]
context = "."

[env]
MISE_YES = "1"
MIX_BUILD_ROOT = "/vm/artifacts/_build"
MIX_XDG = "1"
KERL_BASE_DIR = "/vm/artifacts/.kerl"
KERL_CONFIGURE_OPTIONS = "--without-javac --without-wx --without-odbc"
GIT_AUTHOR_NAME = "N. G. Scheurich"
GIT_AUTHOR_EMAIL = "nick@scheurich.me"
GIT_COMMITTER_NAME = "N. G. Scheurich"
GIT_COMMITTER_EMAIL = "nick@scheurich.me"

[[mounts]]
type = "bind"
source = "~/.claude"
target = "/root/.claude"

[[mounts]]
type = "bind"
source = "~/.claude.json"
target = "/root/.claude.json"

[[mounts]]
type = "tmpfs"
target = "/tmp"
size = "512M"

[aliases]
claude = "exec -- claude"
bash = "exec -- bash"

[volumes.mise_store]
target = "/root/.local/share/mise"
scope = "project"

[volumes.hex_cache]
target = "/root/.cache/hex"
scope = "project"

[network]
policy = "public"
host_ports = [3000]

[bootstrap]
run = '''
set -eu
mise trust
mise install
mix local.hex --force --if-missing
mix local.rebar --force --if-missing
'''
